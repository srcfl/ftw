# Optional beta overlay. Core and SQLite keep their normal lifecycle.
# Pin matches .github/workflows/ftwdb-shadow-contract.yml.
services:
  ftw:
    environment:
      FTWDB_SHADOW_SOCKET: /run/ftwdb-shadow/shadow.sock
    volumes:
      - ftwdb-shadow-run:/run/ftwdb-shadow

  ftwdb-shadow:
    profiles: [ftwdb-shadow]
    build:
      context: https://github.com/srcfl/ftwdb.git#1a74d62667ffe5d30d0ee58a1bcfdab8d7eabfb6
    image: ftwdb-shadow:1a74d62667ffe5d30d0ee58a1bcfdab8d7eabfb6
    user: "100:101"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    restart: "no"
    stop_grace_period: 30s
    volumes:
      - ftwdb-shadow-data:/var/lib/ftwdb-shadow
      - ftwdb-shadow-run:/run/ftwdb-shadow

volumes:
  ftwdb-shadow-data:
  ftwdb-shadow-run:
