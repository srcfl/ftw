# FTW 0.x in Docker. Follow docs/native-beta.md#docker before starting.
# Keep compose.yaml, Dockerfile, .dockerignore and .env together. The ignore
# file keeps private data out of the build context, including on later builds.
# Use separate empty data; stop old Core and its updater before starting here.
# A separate project name does not prevent two Cores controlling one site.
# Update: change FTW_VERSION in .env and rebuild as the guide describes.
name: ftw-local

services:
  ftw:
    build:
      context: .
      args:
        FTW_VERSION: ${FTW_VERSION:?Set FTW_VERSION in .env to an exact published new 0.x tag}
    image: ftw-local:${FTW_VERSION}
    restart: unless-stopped
    # Core saves its state on a clean stop.
    stop_grace_period: 60s
    # Modbus, MQTT and mDNS devices on the LAN need the host's network.
    # Linux only; Docker Desktop keeps this network inside its VM.
    network_mode: host
    # :z lets SELinux hosts such as Fedora share the directory; elsewhere it
    # does nothing.
    volumes:
      - ./data:/app/data:z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
