name: Feature request
description: Suggest a new feature or enhancement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Great. For open-ended discussion, consider starting
        a thread in [Discussions](../../discussions) first — issues are
        best for concrete, actionable proposals.

        PRs are welcome, preferably based on an issue. A broad idea can also
        start as a short Markdown PR; a concrete fix should include test evidence.
        You do not need to design an API or write code to make a request.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do? What's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired result
      description: Describe the result you want. A technical design is optional.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you've tried or thought about.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and source material
      description: Link real hardware or protocol documents, tariff rules, screenshots, logs, user reports, or other evidence that defines the need.
      placeholder: State what the source proves, its version or effective date, and any limits.
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries, failure behavior and proof
      description: What stays out of scope? How should failure stay safe? What test, run, HIL result, or rendered view would prove the change?
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Driver (new hardware support)
        - Control / dispatch
        - Battery model / self-tune
        - MPC / planner
        - PV / load / price twins
        - HTTP API
        - Web UI
        - Home Assistant integration
        - Nova federation
        - Self-update / deploy
        - Docs
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Hardware datasheets, protocol docs, screenshots, links.
