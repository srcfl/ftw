name: Bug report
description: Report a bug in FTW
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the
        details below so the community can reproduce and evaluate it.

        PRs are welcome. Prefer linking a fix to this report and include
        test steps and results. See [CONTRIBUTING.md](https://github.com/srcfl/ftw/blob/master/CONTRIBUTING.md).

        FTW Community has no guaranteed response or resolution time. Do not
        include credentials, access tokens, private keys, or unredacted
        configuration and energy data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Configure '...'
        2. Run '...'
        3. Observe '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The first line of `ftw status`, or the version shown in the web UI.
      placeholder: e.g. v0.136.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Native 0.x (install.sh)
        - Docker 0.x (deploy/docker)
        - Docker 1.x, 2.x or 3.x
        - Home Assistant add-on
        - Local dev (`make dev`)
        - Other
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware / drivers in use
      description: Inverter / battery / meter brands and which Lua drivers are loaded.
      placeholder: e.g. Sungrow SH10RT, Ferroamp EnergyHub, P1 meter
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        `ftw status` and `journalctl -u ftw -n 200` (Docker: `docker compose logs --tail 200`).
        Redact secrets and addresses. `ftw support` writes a fuller file; share it privately if you prefer.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Config snippets, screenshots, network topology, etc.
