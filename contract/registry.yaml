# FTW shared contract registry.
#
# The single source for every name shared between this app and the box, and
# the same file in both repositories — byte for byte.
#
# In srcfl/ftw it generates Go constants: go/internal/appproto/contract_gen.go
# and go/internal/apiauth/contract_gen.go, from `go generate ./internal/...`.
# In srcfl/ftw-webapp there is no generator — src/lib/protocol/contract.ts and
# the error table in src/lib/protocol/messages.ts are written by hand and read
# back against this file by tests/registry-contract.test.ts.
#
# The two copies are compared in CI on both sides: the app runs
# scripts/check-contract-drift.mjs against a checkout of the box, and the box's
# test workflow runs the same comparison against a checkout of the app. Neither
# passes when the other repository is missing. Change one copy and change the
# other in the same pair of pull requests.
#
# Never hand-write one of these names in either language. Three separate
# namespaces for authorisation already exist in the codebase; this file is
# what stops that from happening again.
#
# One YAML trap, learned the hard way: a `desc` is a flow-mapping value, so an
# unquoted comma ends it. Go read `Route replaces a whole document, not part of
# one` as `Route replaces a whole document` and generated a truncated comment
# while the app's line-based reader saw the whole sentence. Keep commas out of
# a desc, or quote it.

version: 1

# ---------------------------------------------------------------------------
# Frozen field ids. Permanent as of v1 — an app of any age can draw the core
# view from these alone. Freezing them now is free. Adding to the frozen set
# later is not, so think before extending.
# ---------------------------------------------------------------------------
frozen_fields:
  1: { name: mode, kind: enum, unit: null }
  2: { name: grid_w, kind: power, unit: W }
  3: { name: pv_w, kind: power, unit: W }
  4: { name: battery_w, kind: power, unit: W }
  5: { name: battery_soc, kind: ratio, unit: permille }
  6: { name: load_w, kind: power, unit: W }
  7: { name: src_grid, kind: source_ref, unit: null }
  8: { name: src_pv, kind: source_ref, unit: null }
  9: { name: src_battery, kind: source_ref, unit: null }
  # Frozen means the id's meaning never changes — not that the field is
  # always present. Like battery_soc, ev_w is sent only when the box has
  # a charger to measure; a site without one sends nothing, and the app
  # draws no EV node rather than a dead one. Positive while charging,
  # by the site convention: the charger consumes like any other load.
  10: { name: ev_w, kind: power, unit: W }

# ---------------------------------------------------------------------------
# Capabilities. A set of names, not version numbers. Absent means the box does
# not have it; the UI hides the feature and never crashes.
# ---------------------------------------------------------------------------
capabilities:
  - status.core
  - status.phases
  - status.drivers
  - history.5m
  - history.1h
  - history.etag
  - cmd.lease
  - cmd.precondition
  - cmd.readback
  - der.battery
  - der.ev
  - der.v2x
  - plan.dispatch
  - net.webrtc
  # Electricity prices, when the box has a zone configured and rows stored.
  # Absent means the app draws no price view rather than an empty one.
  - price.spot
  # The box's own HTTP API, carried over the session. Absent means the app
  # hides every view that needs it and never crashes — the same rule as
  # history.5m. Present does not mean every path is reachable: reads and
  # configuration go through, anything that moves energy stays on cmd.
  - api.passthrough

# ---------------------------------------------------------------------------
# Scopes. One object axis, two verb axes: <object>.<read|write>.
# Roles are a UI projection over these, never a replacement for them.
# ---------------------------------------------------------------------------
scopes:
  - { name: ftw.live.read, desc: Current readings and freshness }
  - { name: ftw.history.read, desc: Stored history }
  - { name: ftw.plan.read, desc: Dispatch plan and its reasoning }
  - { name: ftw.health.read, desc: Box and driver health }
  - { name: ftw.assets.read, desc: Devices and their capabilities }
  - { name: ftw.dispatch.write, desc: Control energy assets }
  - { name: ftw.mode.write, desc: Change site operating mode }
  - { name: ftw.members.read, desc: See who has access }
  - { name: ftw.members.write, desc: Invite and revoke }

roles:
  owner:
    label: Owner
    scopes: ['*']
  viewer:
    label: Viewer
    scopes: [ftw.live.read]

# ---------------------------------------------------------------------------
# Command operations. What a `cmd` frame may name, and the scope the grant
# must carry before the box acts on it.
#
# The box's own table — defaultOps() in go/internal/appproto/command.go — is
# the authority on what a given box accepts. The pair is copied here because
# both sides used to hand-write it: the box beside its dispatcher, the app in
# its simulator, and nothing compared the two. An op declared here that a box
# does not implement is answered with E_UNKNOWN_OP like any other stranger —
# battery.hold is the app's vocabulary today and no shipping box acts on it
# yet.
# ---------------------------------------------------------------------------
ops:
  - { name: site.mode.set, scope: ftw.mode.write, desc: Change the site operating mode }
  - { name: battery.hold, scope: ftw.dispatch.write, desc: Hold the battery at a fixed setpoint }
  - { name: loadpoint.hold, scope: ftw.dispatch.write, desc: Charge the car now at a fixed current }
  - { name: loadpoint.boost, scope: ftw.dispatch.write, desc: Boost the car from the house battery }
  - { name: loadpoint.soc.set, scope: ftw.dispatch.write, desc: Correct the car's current charge level }
  - { name: loadpoint.surplus_only.set, scope: ftw.dispatch.write, desc: Charge the car from surplus PV only }

# ---------------------------------------------------------------------------
# Dispatch modes.
#
# These keys are FTW's, from control.AllModes() in go/internal/control/
# dispatch.go. They are copied here so the app can validate and translate
# them — not so the app can decide what exists.
#
# The box is the authority: it sends its own catalogue (key, label, tooltip,
# tier) and the app renders that. A mode listed here gets our own wording; a
# mode we have never heard of still appears, using the box's label. That is
# what lets a newer box ship a new strategy without waiting for an app
# release, and it is the same degrade-don't-die rule as capabilities.
#
# tier decides placement, not permission:
#   primary  — the forecast-driven strategies, shown as the main choices
#   advanced — manual fallbacks, behind a "More ways to run it" disclosure
#   hidden   — valid over the API but never rendered as a button
# ---------------------------------------------------------------------------
modes:
  - { key: planner_passive_arbitrage, tier: primary }
  - { key: planner_arbitrage, tier: primary }
  - { key: idle, tier: advanced }
  - { key: self_consumption, tier: advanced }
  - { key: peak_shaving, tier: advanced }
  - { key: charge, tier: advanced }
  - { key: planner_self, tier: hidden }
  - { key: planner_cheap, tier: hidden }
  - { key: priority, tier: hidden }
  - { key: weighted, tier: hidden }

# ---------------------------------------------------------------------------
# Error codes the box sends. The box sends the code and args; this app owns all
# prose. retryable tells the client whether to offer a retry at all.
# ---------------------------------------------------------------------------
errors:
  - { code: E_BOOTING, retryable: true, desc: Box is starting up }
  - { code: E_UNKNOWN_OP, retryable: false, desc: Message type not understood }
  - { code: E_CMD_EXPIRED, retryable: false, desc: Command outlived not_valid_after_ms }
  - { code: E_PRECONDITION, retryable: false, desc: Guard failed against fresh state }
  - { code: E_CONFLICT, retryable: true, desc: expect.rev did not match }
  - { code: E_SCOPE_DENIED, retryable: false, desc: Grant lacks the required scope }
  - { code: E_GRANT_REVOKED, retryable: false, desc: Access was withdrawn }
  - { code: E_LAST_OWNER_PROTECTED, retryable: false, desc: Cannot remove the only owner }
  - { code: E_RANGE_TOO_LARGE, retryable: false, desc: History window exceeds the limit }
  - { code: E_UNAVAILABLE, retryable: true, desc: Source or subsystem is down }
  # The passthrough's refusals. Each is a different sentence to a user, which
  # is why none of them reuses a code above: a shared name that means two
  # things is what this file exists to prevent.
  #
  # E_NEEDS_STEP_UP is the one retryable refusal here, and it is retryable
  # because the very same request goes through once the passkey ceremony has
  # run — the box refuses on `!req.StepUp` alone and the app sends it again
  # itself. The others are the box's answer about the route, and asking a
  # second time gets the same answer.
  - { code: E_NEEDS_STEP_UP, retryable: true, desc: Request needs a fresh passkey ceremony }
  - { code: E_USE_CMD, retryable: false, desc: Route moves energy and belongs on cmd }
  - { code: E_UNSUPPORTED_MEDIA, retryable: false, desc: Answer is not a kind the session carries }
  - { code: E_WHOLE_DOCUMENT, retryable: false, desc: Route replaces a whole document rather than part of one }
  # A route the session does not carry at all: its answer holds a credential,
  # or doing it needs somebody standing at the box. Not a permission the owner
  # is missing, so neither a role nor a ceremony changes the answer.
  - { code: E_LOCAL_ONLY, retryable: false, desc: Route is served only on the box's own page }

# ---------------------------------------------------------------------------
# Error codes the client raises for itself.
#
# These never cross the wire. The box generates nothing from this block and
# must never send one of them; the app raises them locally and they meet the
# same prose and retry rules as everything above.
#
# They are written down here rather than in the app alone because the app's
# error table is checked against this file in full. A code with no home here
# would need an exemption in that check, and an exemption list is exactly the
# thing this file exists to avoid.
# ---------------------------------------------------------------------------
client_errors:
  # A cut-off answer is not an error on the wire: by the time the box knows it
  # has run out of room, a status has gone out and the app is committed to it,
  # so the box reports it as `truncated: true` on api.end. The app turns that
  # into a code because half a document is not an answer and a view needs one
  # thing to catch.
  - { code: E_RESPONSE_TOO_LARGE, retryable: false, desc: The answer arrived cut off }
  # The session's own command deadlines. No ack inside the window — or the
  # carrier closed with the command still unacknowledged — means the box never
  # took the intent, so asking again cannot make anything happen twice.
  - { code: E_NO_ACK, retryable: true, desc: The command was never acknowledged }
  # The wire went away or the deadline passed before any status arrived. The
  # session reconnects on its own, so the same request can simply be asked
  # again.
  - { code: E_NO_ANSWER, retryable: true, desc: The request got no answer at all }
  # An answer this app could not read: a body that is not the JSON it claimed
  # to be, or one that contradicts what was asked. The box and the app
  # disagree about a route, and asking again gets the same answer.
  - { code: E_BAD_BODY, retryable: false, desc: The answer could not be read }

# ---------------------------------------------------------------------------
# Source states. Orthogonal to carrier state — see docs/protocol.md. Merging
# the two into one enum cannot express "connected, but the inverter is quiet".
# ---------------------------------------------------------------------------
source_states: [live, lagging, stale, down, never]
carrier_states: [webrtc, relay, cache, none]

# ---------------------------------------------------------------------------
# History resolutions backed by what the box actually stores.
# ---------------------------------------------------------------------------
resolutions:
  '5m': { tile_span_ms: 43200000, retention_days: 30, source: energy_ledger }
  '1h': { tile_span_ms: 604800000, retention_days: 730, source: hourly_rollup }
